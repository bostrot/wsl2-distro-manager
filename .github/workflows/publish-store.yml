name: Publish to Microsoft Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.11.0)
        required: true
        type: string
  release:
    types: [published, created]

concurrency:
  group: publish-store-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Tag is empty" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: scripts/publish_store.sh
          sparse-checkout-cone-mode: false

      - name: Download release asset
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: tags/${{ steps.resolve.outputs.tag }}
          file: wsl2-distro-manager-${{ steps.resolve.outputs.tag }}-unsigned.msix
          target: ${{ github.workspace }}/pkg/wsl2-distro-manager-${{ steps.resolve.outputs.tag }}-unsigned.msix

      # The legacy submission API cannot express market-group pricing: it
      # reports the base price as "Base" and a publish through it turns the
      # app Free everywhere (2026-09-07/08). The script refuses in that case
      # — expect this job to fail while the Store pricing is set by market
      # groups; update the package by hand in Partner Center then.
      - name: Publish to Store
        env:
          STORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
        run: |
          scripts/publish_store.sh \
            "pkg/wsl2-distro-manager-${{ steps.resolve.outputs.tag }}-unsigned.msix"
