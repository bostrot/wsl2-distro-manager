name: Publish to Microsoft Store

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to publish (e.g. v1.11.0)
        required: true
        type: string
      mode:
        description: >-
          publish = real publish. dry-run = create a submission, write the
          pricing, read it back, report, delete; nothing is uploaded or
          committed. Use dry-run after any change to store/pricing.json.
        required: false
        default: publish
        type: choice
        options: [publish, dry-run]
      pricing_file:
        description: >-
          Pricing to state instead of echoing the clone's (e.g.
          store/pricing.json). Empty = the clone must round-trip on its own,
          which fails on Pricing Version 2 products by design.
        required: false
        default: ""
        type: string
  release:
    types: [published, created]

concurrency:
  group: publish-store-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: resolve
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${{ github.event.release.tag_name }}"
          fi

          if [[ -z "$TAG" ]]; then
            echo "Tag is empty" >&2
            exit 1
          fi

          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          sparse-checkout: |
            scripts/publish_store.sh
            scripts/store_pricing.jq
            store/pricing.json
          sparse-checkout-cone-mode: false

      - name: Download release asset
        uses: dsaltares/fetch-gh-release-asset@master
        with:
          version: tags/${{ steps.resolve.outputs.tag }}
          file: wsl2-distro-manager-${{ steps.resolve.outputs.tag }}-unsigned.msix
          target: ${{ github.workspace }}/pkg/wsl2-distro-manager-${{ steps.resolve.outputs.tag }}-unsigned.msix

      # The legacy submission API cannot read "Pricing Version 2" pricing
      # (prices set in the Partner Center UI): it reports the base price as
      # "Base", and a publish that echoes it turns the app Free everywhere
      # (2026-09-07/08). Without pricing_file the script refuses in that
      # case. With pricing_file it states store/pricing.json instead; prove
      # that with mode=dry-run before pointing a release at it.
      - name: Publish to Store
        env:
          STORE_TENANT_ID: ${{ secrets.AZURE_AD_TENANT_ID }}
          STORE_CLIENT_ID: ${{ secrets.AZURE_AD_APPLICATION_CLIENT_ID }}
          STORE_CLIENT_SECRET: ${{ secrets.AZURE_AD_APPLICATION_SECRET }}
          STORE_APP_ID: ${{ secrets.STORE_APP_ID }}
          PRICING_FILE: ${{ inputs.pricing_file }}
          DRY_RUN: ${{ inputs.mode == 'dry-run' && '1' || '0' }}
        run: |
          scripts/publish_store.sh \
            "pkg/wsl2-distro-manager-${{ steps.resolve.outputs.tag }}-unsigned.msix"
